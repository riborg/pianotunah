# Traefik router and network. Added via COMPOSE_FILE in .env.
services:
  pianotunah:
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?set in .env}
      - traefik.http.routers.pianotunah.rule=Host(`${PIANOTUNAH_HOST:?set in .env}`)
      - traefik.http.routers.pianotunah.entrypoints=${TRAEFIK_ENTRYPOINT:?set in .env}
      - traefik.http.routers.pianotunah.tls=true
      - traefik.http.routers.pianotunah.middlewares=${TRAEFIK_MIDDLEWARES:?set in .env}
      - traefik.http.services.pianotunah.loadbalancer.server.port=8080

networks:
  proxy:
    name: ${TRAEFIK_NETWORK:?set in .env}
    external: true
