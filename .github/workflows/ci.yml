# Tests and a test build of the image. Runs on push and pull requests, and from
# release.yml before anything is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests
        run: npm test

      - uses: actions/setup-go@v7
        with:
          go-version: stable # govulncheck needs a current Go
          cache: false # no dependencies, no go.sum
      - name: Go vet and build
        run: |
          go vet ./...
          go build ./...

      - uses: docker/setup-buildx-action@v4
      - name: Test build of the image (amd64, arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Vulnerabilities in practice come from the Go version the image is built
      # with, so the binary in the image is scanned, not the source with CI's Go.
      - name: Load the amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pianotunah:ci
          cache-from: type=gha
      - name: Vulnerability check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          id=$(docker create pianotunah:ci)
          docker cp "$id:/pianotunah" ./pianotunah-bin
          docker rm "$id"
          "$(go env GOPATH)/bin/govulncheck" -mode=binary ./pianotunah-bin
