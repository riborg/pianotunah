# Tests and a test build of the image. Runs on push and pull requests, and from
# release.yml before anything is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Unit tests
        run: npm test

      - uses: actions/setup-go@v7
        with:
          go-version: stable # govulncheck needs a current Go
          cache: false # no dependencies, no go.sum
      - name: Go vet and build
        run: |
          go vet ./...
          go build ./...

      - uses: docker/setup-buildx-action@v4
      - name: Test build of the image (amd64, arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Vulnerabilities in practice come from the Go version the image is built
      # with, so the binary in the image is scanned, not the source with CI's Go.
      - name: Load the amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pianotunah:ci
          cache-from: type=gha
      - name: Vulnerability check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          id=$(docker create pianotunah:ci)
          docker cp "$id:/pianotunah" ./pianotunah-bin
          docker rm "$id"
          "$(go env GOPATH)/bin/govulncheck" -mode=binary ./pianotunah-bin

  # The Swift core (mac/) is tested against fixtures written from the web JS.
  # They must be regenerated when the JS changes; see docs/macos-port.md.
  # The same image as in DEVELOP.md: Node's Math.pow comes from the C
  # library, and musl (Alpine) and glibc (setup-node) differ in the last bit.
  fixtures:
    runs-on: ubuntu-latest
    container: node:26.13.1-alpine
    steps:
      - run: apk add --no-cache git
      - uses: actions/checkout@v7
      - name: Swift fixtures match the JS
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --is-inside-work-tree # the checks below need the clone
          node test/fixtures.mjs
          git diff --exit-code mac/Tests/PianoTunahCoreTests/Fixtures
          test -z "$(git status --porcelain mac/Tests/PianoTunahCoreTests/Fixtures)"

  swift:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7
      - name: Swift core tests
        working-directory: mac
        run: swift test

  # The same tests with Apple's Foundation and libm on arm64, where the app
  # runs: the DSP and format fixtures must hold there too.
  swift-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Swift core tests on macOS
        working-directory: mac
        run: |
          swift --version
          uname -m
          swift test
