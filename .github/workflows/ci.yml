# Tester och provbygge av imagen. Körs vid push och pull requests, och av
# release.yml innan något publiceras.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enhetstester
        run: npm test

      - uses: actions/setup-go@v7
        with:
          go-version: stable # govulncheck kräver en aktuell Go
          cache: false # inga beroenden, ingen go.sum
      - name: Go vet och bygge
        run: |
          go vet ./...
          go build ./...

      - uses: docker/setup-buildx-action@v4
      - name: Provbygg imagen (amd64, arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sårbarheter kommer i praktiken från Go-versionen imagen byggs med, så
      # binären i imagen skannas, inte källkoden med CI:ns Go.
      - name: Ladda amd64-imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pianotunah:ci
          cache-from: type=gha
      - name: Sårbarhetskontroll (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          id=$(docker create pianotunah:ci)
          docker cp "$id:/pianotunah" ./pianotunah-bin
          docker rm "$id"
          "$(go env GOPATH)/bin/govulncheck" -mode=binary ./pianotunah-bin
