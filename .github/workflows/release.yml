# Release: pusha en tagg vX.Y.Z.
#   1. CI körs (tester och provbygge).
#   2. Imagen byggs för amd64 och arm64 och publiceras på ghcr.io med
#      taggarna X.Y.Z, X.Y, X och latest (latest inte för förhandsversioner,
#      t.ex. v1.0.0-rc.1).
#   3. En GitHub Release skapas med commits sedan förra taggen.
name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hela historiken för ändringslistan

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Bygg och publicera imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha

      - name: Skapa GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "## Ändringar${prev:+ sedan $prev}"
            git log --no-merges --pretty='- %s' "${prev:+$prev..}$TAG"
            echo
            echo "Image: \`ghcr.io/${GITHUB_REPOSITORY}:${TAG#v}\`"
          } > notes.md
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" --title "$TAG" --notes-file notes.md "${flags[@]}"
