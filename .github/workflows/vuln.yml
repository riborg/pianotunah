# Weekly check of the published image. New Go vulnerabilities are found after
# a release is built; a red run means it is time for a new release (built with
# the latest Go patch).
name: Vulnerabilities

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: govulncheck on ghcr.io/${{ github.repository }}:latest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:latest"
          docker pull "$image"
          id=$(docker create "$image")
          docker cp "$id:/pianotunah" ./pianotunah-bin
          docker rm "$id"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" -mode=binary ./pianotunah-bin
