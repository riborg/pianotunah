services:
  pianotunah:
    container_name: pianotunah
    # The release image; updated when a new version is published.
    image: ghcr.io/riborg/pianotunah:latest
    # Local build instead: docker compose up -d --build
    build: .
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data
    # Plain http; put a reverse proxy with https in front (see README).
    ports:
      - ${PIANOTUNAH_PORT:-8080}:8080
